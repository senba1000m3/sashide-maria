<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <meta
            name="description"
            content="指出毬亞生日倒數與每日一毬粉絲網站"
        />
        <title>指出毬亞生日倒數｜每日一毬</title>
        <link rel="stylesheet" href="css/style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <script src="js/script.js" defer></script>
    </head>
    <body>
        <main class="container">
            <section class="center-wrapper" aria-label="生日倒數與每日抽籤">
                <div class="countdown-container" id="countdownContainer">
                    <h1 class="countdown-title">指出毬亞生日倒數</h1>

                    <div
                        class="countdown-timer"
                        id="timer"
                        role="timer"
                        aria-label="距離指出毬亞生日的剩餘時間"
                    >
                        <div class="time-unit">
                            <span id="days">00</span>
                            <span class="unit-label">天</span>
                        </div>
                        <div class="time-unit">
                            <span id="hours">00</span>
                            <span class="unit-label">時</span>
                        </div>
                        <div class="time-unit">
                            <span id="minutes">00</span>
                            <span class="unit-label">分</span>
                        </div>
                        <div class="time-unit">
                            <span id="seconds">00</span>
                            <span class="unit-label">秒</span>
                        </div>
                    </div>

                    <div
                        class="birthday-message"
                        id="birthdayMessage"
                        role="status"
                        hidden
                    >
                        <span class="birthday-sparkles" aria-hidden="true">✦</span>
                        <p>指出毬亞，生日快樂！</p>
                        <span class="birthday-sparkles" aria-hidden="true">✦</span>
                    </div>
                </div>

                <div class="omikuji-container">
                    <button class="omikuji-btn" id="omikujiBtn" type="button">
                        每日一毬
                    </button>
                    <p class="omikuji-note" id="omikujiNote">
                        每天日本時間 00:00 更新
                    </p>
                </div>
            </section>

            <dialog
                id="omikujiModal"
                class="modal"
                aria-labelledby="modalTitle"
            >
                <article class="modal-content">
                    <button
                        class="close-modal"
                        id="closeModal"
                        type="button"
                        aria-label="關閉今日籤運"
                    >
                        <span aria-hidden="true">&times;</span>
                    </button>

                    <div class="draw-loading" id="drawLoading" role="status">
                        <div class="omikuji-shaker" aria-hidden="true">御籤</div>
                        <p>抽籤中…</p>
                    </div>

                    <section class="result-card" id="resultCard" hidden>
                        <p class="result-eyebrow" id="modalTitle">今日籤運</p>
                        <h2 class="result-level" id="modalLevel"></h2>

                        <div class="result-image-frame" id="resultImageFrame">
                            <img
                                id="modalImage"
                                class="modal-image"
                                src=""
                                alt=""
                            />
                            <p class="image-error" id="imageError" hidden>
                                圖片暫時無法載入，稍後再試一次吧。
                            </p>
                        </div>

                        <p class="result-message" id="modalMessage"></p>

                        <div class="result-actions">
                            <button
                                class="action-btn action-btn-primary"
                                id="shareResult"
                                type="button"
                            >
                                <i
                                    class="fa-solid fa-link"
                                    aria-hidden="true"
                                ></i>
                                複製連結
                            </button>
                            <button
                                class="action-btn"
                                id="downloadResult"
                                type="button"
                            >
                                <i
                                    class="fa-solid fa-download"
                                    aria-hidden="true"
                                ></i>
                                下載結果卡
                            </button>
                        </div>
                        <p
                            class="action-status"
                            id="actionStatus"
                            role="status"
                            aria-live="polite"
                        ></p>
                    </section>
                </article>
            </dialog>

            <nav class="footer-links" aria-label="指出毬亞相關連結">
                <a href="https://x.com/sashide_m" target="_blank" rel="noopener noreferrer"
                    ><i class="fa-brands fa-x-twitter" aria-hidden="true"></i> Twitter</a
                >
                <a href="https://www.nicovideo.jp/series/315273" target="_blank" rel="noopener noreferrer"
                    ><i class="fa-solid fa-video" aria-hidden="true"></i> Niconico</a
                >
                <a href="https://www.instagram.com/mariasashide_/" target="_blank" rel="noopener noreferrer"
                    ><i class="fa-brands fa-instagram" aria-hidden="true"></i> Instagram</a
                >
                <a href="https://qlover.jp/sashidega" target="_blank" rel="noopener noreferrer"
                    ><i class="fa-solid fa-heart" aria-hidden="true"></i> QloveR</a
                >
                <a href="https://ani.chokume.com/" target="_blank" rel="noopener noreferrer"
                    ><i class="fa-solid fa-envelope" aria-hidden="true"></i> Chokume</a
                >
                <a href="https://withline.jp/talent/maria_sashide" target="_blank" rel="noopener noreferrer"
                    ><i class="fa-solid fa-globe" aria-hidden="true"></i> Homepage</a
                >
            </nav>

            <img
                src="images/left_standee.png"
                alt="指出毬亞左側人物立繪"
                class="standee standee-left"
                id="standeeLeft"
            />
            <div
                id="placeholderLeft"
                class="standee standee-left placeholder"
                hidden
            >
                指出毬亞
            </div>

            <img
                src="images/right_standee.png"
                alt="指出毬亞右側人物立繪"
                class="standee standee-right"
                id="standeeRight"
            />
            <div
                id="placeholderRight"
                class="standee standee-right placeholder"
                hidden
            >
                指出毬亞
            </div>
        </main>
    </body>
</html>
